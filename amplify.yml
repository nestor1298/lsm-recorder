# Buildspec de Amplify Hosting (Next.js 16, plataforma WEB_COMPUTE).
# Las variables de entorno vienen de la app de Amplify (definidas en el CDK
# stack); no hay access keys — el SSR usa el rol signalab-amplify-compute.
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 22
        - nvm use 22
        - npm ci
    build:
      commands:
        # Las env vars del app de Amplify existen solo en el build; el runtime
        # SSR lee .env.production, así que las volcamos ahí (gotcha documentado
        # de Amplify Hosting para WEB_COMPUTE).
        - env | grep -e '^SIGNALAB_' -e '^NEXT_PUBLIC_' >> .env.production || true
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
